services:
  oracle19c:
    image: gvenzl/oracle-free:latest
    container_name: oracle19c

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: "123456"
      APP_USER: "octopus"
      APP_USER_PASSWORD: "123456"

    volumes:
      - oracle_data:/opt/oracle/oradata

    restart: unless-stopped

volumes:
  oracle_data: